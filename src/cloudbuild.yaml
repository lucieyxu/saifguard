steps:
  # 1. Pull the latest image to use as cache-from (ignore if it doesn't exist yet)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Pull Cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest || true'

  # 2. Build the container image using BuildKit and the pulled image for caching
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Image'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # 3. Push the versioned build image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}'

  # 4. Push the latest image to Artifact Registry for caching next time
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Latest Image for Cache'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'

  # 5. Prepare workspace permissions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Prepare Workspace Permissions'
    entrypoint: 'chmod'
    args: ['777', '/workspace']

  # 6. Ensure Agent Platform Runtime exists or create it, then save its ID
  - name: '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}'
    id: 'Ensure Agent Platform Runtime'
    entrypoint: 'python'
    args:
      - 'ensure_agent_engine.py'
      - '${_SERVICE_NAME}-sessions'
      - '/workspace/agent_engine_id.txt'
    env:
      - 'PROJECT_ID=${_PROJECT_ID}'
      - 'REGION=${_REGION}'
      - 'GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}'
      - 'GOOGLE_CLOUD_LOCATION=${_REGION}'

  # 7. Deploy to Cloud Run with AGENT_RUNTIME_ID configured
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'bash'
    args:
